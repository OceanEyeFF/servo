name: Governance Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'toolchain/scripts/deploy/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --requirement .github/requirements-ci.txt

      - name: Folder logic check
        run: python toolchain/scripts/test/folder_logic_check.py

      - name: Path governance check
        run: python toolchain/scripts/test/path_governance_check.py

      - name: Governance semantic check
        run: python toolchain/scripts/test/governance_semantic_check.py

      - name: Governance tests
        run: python -m pytest toolchain/scripts/test

      - name: Deploy package smoke
        run: npm --prefix toolchain/scripts/deploy run smoke --silent

      - name: Deploy package unit tests
        run: npm --prefix toolchain/scripts/deploy test --silent

      - name: Deploy package pack dry-run
        working-directory: toolchain/scripts/deploy
        run: npm pack --dry-run --json

      - name: Deploy package tarball smoke
        working-directory: toolchain/scripts/deploy
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          package_path="$(bash "$GITHUB_WORKSPACE/toolchain/scripts/test/npm_pack_tarball.sh" "$tmpdir")"
          npm exec --yes --package "$package_path" -- servo-installer --help
          npm exec --yes --package "$package_path" -- servo-installer --version
          AW_HARNESS_REPO_ROOT="$GITHUB_WORKSPACE" npm exec --yes --package "$package_path" -- servo-installer diagnose --backend agents --json
          AW_HARNESS_REPO_ROOT="$GITHUB_WORKSPACE" npm exec --yes --package "$package_path" -- servo-installer update --backend agents --json

      - name: Root servo-installer package pack dry-run
        run: npm pack --dry-run --json

      - name: Root servo-installer publish dry-run
        run: npm run publish:dry-run --silent

      - name: Root servo-installer package tarball smoke
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          package_path="$(bash toolchain/scripts/test/npm_pack_tarball.sh "$tmpdir")"
          target_repo="$tmpdir/target-repo"
          mkdir -p "$target_repo"
          (
            cd "$target_repo"
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer --help
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer --version
            if AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer tui > "$tmpdir/tui.out" 2> "$tmpdir/tui.err"; then
              echo "expected servo-installer tui to require an interactive terminal" >&2
              exit 1
            fi
            test ! -s "$tmpdir/tui.out"
            grep -F "servo-installer tui requires an interactive terminal" "$tmpdir/tui.err"
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer diagnose --backend agents --json
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer update --backend agents --json
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer install --backend agents
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer verify --backend agents
            AW_HARNESS_REPO_ROOT="" AW_HARNESS_TARGET_REPO_ROOT="" npm exec --yes --package "$package_path" -- servo-installer update --backend agents --yes
          )
